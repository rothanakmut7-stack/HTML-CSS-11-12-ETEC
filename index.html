<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form
      style="
        width: 350px;
        border: 2px solid gray;
        border-radius: 10px;
        padding: 30px;
        margin: auto;
      "
    >
      <h1 style="color: blue; text-align: center; font: size 40px">
        <i>Register</i>
      </h1>
      <label style="font-size: 20px">Enter Email:</label><br />
      <input type="email" />
      <br />
      <label style="font-size: 20px">Enter password:</label><br />
      <input type="password" />
      <br />
      <label style="font-size: 20px">Enter First Name:</label><br />
      <input type="First Name" />
      <br />
      <label style="font-size: 20px">Enter Last Name:</label>
      <br />
      <input type="Last Name" />
      <br />
      <label style="font-size: 20px">Enter Gender:</label><br />
      <input type="Gender" />
      <br />
      <label style="font-size: 20px">Enter Phone Number:</label><br />
      <input type="Phone Number" />

      <br />

      <button>Register</button>
      <br />

      <button>Login</button>
    </form>
  </body>
</html>

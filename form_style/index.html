<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body> 
    <!-- <h1>   hello   </h1> -->
    <hr>
    <form action="" class="form">
      <h1 class="login-text"><b><i>Login</i></b></h1>
      <p class="sub-title"></p>

      <label class="label-input" for="">Email</label><br />
      <input
        name="email"
        class="input-form"
        placeholder="Enter Your email"
        type="email"
      /><br /><br />

      <label class="label-input" for="">Password</label><br />
      <input
        class="input-form"
        name="password"
        type="password"
        required
        class="input-form"
        placeholder="Enter Your Password"
        type="text"
      /><br /><br />
      <button class="button">Reset</button><br><br>
       <input type="checkbox" >Remember me
      <br><br>
      <p class ="or">               or               </p>
      <button class="google-btn">
        <img class="google-logo" src="https://i.pinimg.com/1200x/45/20/dd/4520ddfc56208707045c56232e946f7f.jpg" alt="">
        <span>Google</span>
      </button><br><br>
      <button class="btn-login">Login</button>
    </form>
  </body>
</html>
